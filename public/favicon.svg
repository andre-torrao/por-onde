<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C244F"/>
      <stop offset="100%" stop-color="#2D3D6E"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2D230"/>
      <stop offset="100%" stop-color="#EDC366"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,.06)" stroke-width="1"/>

  <!-- Portugal outline — simplified stylized silhouette -->
  <g filter="url(#shadow)">
    <path
      d="M 210 120
         C 195 122, 185 130, 178 142
         C 168 158, 165 175, 163 192
         C 160 210, 158 228, 160 246
         C 162 264, 168 278, 172 294
         C 176 310, 178 326, 175 342
         C 172 356, 165 368, 162 382
         C 160 392, 164 400, 172 404
         C 182 408, 194 406, 206 402
         C 218 398, 228 392, 238 388
         C 248 384, 260 382, 272 382
         C 284 382, 294 386, 302 380
         C 310 374, 312 362, 310 350
         C 308 336, 302 324, 298 310
         C 294 296, 292 280, 294 264
         C 296 248, 302 234, 305 218
         C 308 202, 308 186, 304 172
         C 300 158, 292 148, 282 140
         C 272 132, 258 124, 244 120
         C 232 117, 220 118, 210 120 Z"
      fill="rgba(255,255,255,.18)"
      stroke="rgba(255,255,255,.35)"
      stroke-width="3"
    />
  </g>

  <!-- Pin / location marker -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Pin body -->
    <path d="M 0 -58 C -28 -58 -50 -36 -50 -8 C -50 24 0 72 0 72 C 0 72 50 24 50 -8 C 50 -36 28 -58 0 -58 Z"
      fill="url(#pin)"/>
    <!-- Pin inner circle -->
    <circle cx="0" cy="-8" r="22" fill="#1C244F" opacity="0.85"/>
    <!-- Pin dot -->
    <circle cx="0" cy="-8" r="9" fill="url(#pin)"/>
  </g>

  <!-- "P" letter mark bottom right — subtle branding -->
  <text x="388" y="420" font-family="Georgia, serif" font-size="72" font-weight="700"
    fill="rgba(255,255,255,.12)" letter-spacing="-2">P</text>
</svg>
